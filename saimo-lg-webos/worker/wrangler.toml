name = "saimo-webos"
main = "src/index.js"
compatibility_date = "2024-10-01"

# EPG: o JSON sai do nx-conexao Pages. O Cron só espelha no KV.
[triggers]
crons = ["50 */4 * * *"]

# npx wrangler secret put TMDB_KEY

# npx wrangler kv namespace create RANKING
# Depois substitua o id abaixo.
[[kv_namespaces]]
binding = "RANKING"
id = "saimo-webos-ranking"
preview_id = "saimo-webos-ranking"
